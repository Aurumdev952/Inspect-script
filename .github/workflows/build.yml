name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.1). Empty = build only.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"; rel=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            v="$INPUT_VERSION"; rel=true
          elif [[ "$COMMIT_MSG" == *"[release]"* ]]; then
            v="v1.0.${GITHUB_RUN_NUMBER}"; rel=true
          else
            v="dev-${GITHUB_SHA::7}"; rel=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
      - name: Add icon, version info and admin manifest
        # A normal Windows manifest + version info (instead of a bare
        # binary) makes antivirus far less likely to flag the exe.
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          v="${{ steps.ver.outputs.version }}"; v="${v#v}"; [[ "$v" =~ ^[0-9.]+$ ]] || v="0.0.0"
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64 --manifest cli --admin \
            --product-name "PC Inspection" --file-description "PC Inspection tool" \
            --original-filename PC-Inspection.exe --product-version "$v" --file-version "$v"
      - name: Build PC-Inspection.exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=${{ steps.ver.outputs.version }}" -o dist/PC-Inspection.exe .
      - name: Package flash disk zip
        run: |
          cp -r flashdisk/. dist/
          python3 build/make-bat.py "${{ steps.ver.outputs.version }}" dist/PC-Inspection.bat
          # Checksums so the tool can tell when driver files got damaged while
          # being copied to a flash disk
          (cd dist/drivers && find . -type f ! -name README.txt ! -name checksums.sha256 -printf '%P\n' | sort | xargs -d '\n' sha256sum > checksums.sha256 && wc -l checksums.sha256)
          # Everything inside ONE folder, so the whole thing is one copy to the flash disk
          mkdir -p pkg/PC-Inspection && cp -r dist/. pkg/PC-Inspection/
          cd pkg && zip -r ../PC-Inspection-${{ steps.ver.outputs.version }}.zip PC-Inspection
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Inspection
          path: |
            PC-Inspection-*.zip
            dist/PC-Inspection.exe
            dist/PC-Inspection.bat

  windows-smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PC-Inspection
      - name: PowerShell syntax check
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw "Syntax errors in $($f.Name)" }
            Write-Host "OK: $($f.Name)"
          }
      - name: Network result rules (Wi-Fi works = OK, other devices don't matter)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-NetworkRules.ps1 -Scripts "$PWD\scripts"
          if ($LASTEXITCODE -ne 0) { throw "Network rules test failed" }
      - name: Windows Defender scan of the exe
        continue-on-error: true
        shell: powershell
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$PWD\dist\PC-Inspection.exe" -DisableRemediation
          Write-Host "MpCmdRun exit code: $LASTEXITCODE (0 = clean, 2 = threat found)"
          exit $LASTEXITCODE
      - name: Bundled drivers are accepted by Windows
        shell: powershell
        run: |
          $out = pnputil.exe /add-driver "flashdisk\drivers\*.inf" /subdirs
          $out | Write-Host
          $added = ($out | Select-String 'Added driver packages:\s*(\d+)').Matches.Groups[1].Value
          $total = (Get-ChildItem flashdisk\drivers -Filter *.inf -Recurse).Count
          Write-Host "Added $added of $total driver packages"
          if ([int]$added -ne $total) { throw "Some bundled drivers were rejected" }
          exit 0
      - name: Run the exe end-to-end (no upload)
        shell: powershell
        run: |
          # Test the real release zip: unzip it and run from its single folder
          Expand-Archive (Get-Item PC-Inspection-*.zip).FullName -DestinationPath flash
          $top = @(Get-ChildItem flash)
          if ($top.Count -ne 1 -or $top[0].Name -ne 'PC-Inspection') { throw "zip must contain exactly one folder 'PC-Inspection'" }
          Get-ChildItem flash\PC-Inspection | Format-Table Name, Length
          $usb = 'flash\PC-Inspection'
          $n = 0
          foreach ($line in Get-Content "$usb\drivers\checksums.sha256") {
            $hash, $rel = $line -split '\s+', 2
            if ((Get-FileHash (Join-Path "$usb\drivers" $rel)).Hash -ne $hash.ToUpper()) { throw "Checksum mismatch: $rel" }
            $n++
          }
          Write-Host "Driver checksums OK ($n files)"
          $p = Start-Process "$usb\PC-Inspection.exe" -ArgumentList '--no-pause','--wait','-Inspector','CI-Test','-NoUpload' -NoNewWindow -Wait -PassThru
          Write-Host "Exit code: $($p.ExitCode)"
          # 0 = PASS, 2 = FAIL (expected on a CI VM: no Wi-Fi, not 14th-gen i5)
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 2) { throw "Inspection crashed (exit $($p.ExitCode))" }
          if (-not (Test-Path "$usb\inspection-log.csv")) { throw "inspection-log.csv was not written" }
          Get-Content "$usb\inspection-log.csv"
          # It must have copied itself + drivers to this PC and run from there
          $local = "$env:ProgramData\PC-Inspection"
          foreach ($f in 'PC-Inspection.exe','config.json') {
            if (-not (Test-Path "$local\$f")) { throw "Not copied to this PC: $f" }
          }
          if (-not (Test-Path "$local\inspection-log.csv")) { throw "Local copy did not run (no log on this PC)" }
          Write-Host "Ran from local copy: OK"
          # Every run must leave complete logs, on this PC and on the flash disk
          $logs = "$local\logs"
          foreach ($pat in 'launcher.log','usage-log.csv','run-*.txt','detail-*.txt','prepare-*.txt') {
            if (-not (Get-ChildItem $logs -Filter $pat -ErrorAction SilentlyContinue)) { throw "Missing log on this PC: $pat" }
          }
          $l = Get-Content "$logs\launcher.log" -Raw
          if ($l -notmatch 'START version=' -or $l -notmatch 'EXIT code=' -or $l -notmatch 'inspection script ended') { throw "launcher.log is incomplete" }
          $u = Import-Csv "$logs\usage-log.csv" | Select-Object -Last 1
          Write-Host "usage-log: $($u.runId) $($u.toolVersion) $($u.inspector) $($u.overallResult) exit=$($u.exitCode) $($u.seconds)s"
          if ($u.inspector -ne 'CI-Test' -or -not $u.logFile -or $u.toolVersion -eq 'dev') { throw "usage-log row is wrong" }
          if (Select-String -Path "$logs\*" -Pattern 'YOUR-WIFI-PASSWORD' -Quiet) { throw "A Wi-Fi password leaked into the logs" }
          foreach ($f in "$usb\logs\usage-log.csv", "$usb\logs\$env:COMPUTERNAME\launcher.log") {
            if (-not (Test-Path $f)) { throw "Logs were not copied to the flash disk: $f" }
          }
          Write-Host "Logs kept on the PC and copied to the flash disk: OK"
      - name: Only the matching driver is copied; damaged files are caught
        shell: powershell
        run: |
          $usb = (Resolve-Path flash\PC-Inspection).Path
          function Copied($dir) { @(Get-ChildItem "$dir\drivers" -Directory -ErrorAction SilentlyContinue | ForEach-Object Name) }

          # Realtek RTL8852BE (the card from the real inspections) -> Realtek only
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Prepare-Local.ps1 -UsbRoot $usb -LocalDir "$PWD\prep-realtek" -HardwareIds 'PCI\VEN_10EC&DEV_B852&SUBSYS_8B3D103C&REV_00;PCI\VEN_10EC&DEV_B852&CC_028000'
          if ($LASTEXITCODE -ne 0) { throw "Prepare failed ($LASTEXITCODE)" }
          $c = @(Copied "$PWD\prep-realtek"); Write-Host "Realtek card -> copied: $($c -join ', ')"
          if ($c.Count -ne 1 -or $c[0] -ne 'Realtek-WiFi') { throw "Expected only Realtek-WiFi" }

          # Intel Wi-Fi 6E (AX210/AX211) -> Intel 6E only
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Prepare-Local.ps1 -UsbRoot $usb -LocalDir "$PWD\prep-intel" -HardwareIds 'PCI\VEN_8086&DEV_2725&SUBSYS_00248086&REV_1A'
          if ($LASTEXITCODE -ne 0) { throw "Prepare failed ($LASTEXITCODE)" }
          $c = @(Copied "$PWD\prep-intel"); Write-Host "Intel card -> copied: $($c -join ', ')"
          if ($c.Count -ne 1 -or $c[0] -ne 'Intel-WiFi-6E') { throw "Expected only Intel-WiFi-6E" }

          # TP-Link Archer T2E (Realtek chipset, PCIe card) -> its V1 and V2 packages only
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Prepare-Local.ps1 -UsbRoot $usb -LocalDir "$PWD\prep-t2e" -HardwareIds 'PCI\VEN_10EC&DEV_C821&SUBSYS_C82110EC&REV_00'
          if ($LASTEXITCODE -ne 0) { throw "Prepare failed ($LASTEXITCODE)" }
          $c = @(Copied "$PWD\prep-t2e"); Write-Host "TP-Link T2E -> copied: $($c -join ', ')"
          if ($c.Count -ne 2 -or $c[0] -ne 'TP-Link-Archer-T2E-V1' -or $c[1] -ne 'TP-Link-Archer-T2E-V2') { throw "Expected only the two TP-Link-Archer-T2E folders" }

          # A card with no driver on the flash disk -> nothing copied, clear message
          $o = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Prepare-Local.ps1 -UsbRoot $usb -LocalDir "$PWD\prep-none" -HardwareIds 'PCI\VEN_ABCD&DEV_1234' | Out-String
          Write-Host $o
          if (@(Copied "$PWD\prep-none").Count -ne 0 -or $o -notmatch 'No driver on the flash disk matches') { throw "Unknown card must copy nothing and say so" }

          # A damaged driver file on the flash disk is reported (exit code 3)
          Copy-Item $usb dmg -Recurse
          $inf = Get-Item dmg\drivers\Realtek-WiFi\rtldata601.dat   # a file next to the .inf, so the package still matches
          $bytes = [IO.File]::ReadAllBytes($inf.FullName); [IO.File]::WriteAllBytes($inf.FullName, $bytes[0..999])
          $o = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Prepare-Local.ps1 -UsbRoot "$PWD\dmg" -LocalDir "$PWD\prep-dmg" -HardwareIds 'PCI\VEN_10EC&DEV_B852' | Out-String
          Write-Host $o
          if ($LASTEXITCODE -ne 3 -or $o -notmatch 'DAMAGED') { throw "Damaged file was not reported" }
          Write-Host "Problem-device filter on this VM:"
          . .\scripts\Setup-Network.ps1
          Get-ProblemNetworkDevices | Format-Table Name, PNPDeviceID
          exit 0
      - name: Each run uploads once as a new row, never backfills, never queues
        shell: powershell
        run: |
          $work = "$PWD\upl"; New-Item -ItemType Directory -Force $work | Out-Null
          'ok' | Set-Content "$work\mode.txt"
          # Fake Google Sheet webhook: counts requests, answers ok / duplicate
          $server = Start-Job -ScriptBlock {
            param($dir)
            $l = [Net.HttpListener]::new(); $l.Prefixes.Add('http://127.0.0.1:18099/'); $l.Start()
            while ($true) {
              $ctx = $l.GetContext()
              Add-Content "$dir\requests.txt" 'req'
              $mode = (Get-Content "$dir\mode.txt" -ErrorAction SilentlyContinue | Select-Object -First 1)
              $json = if ($mode -eq 'duplicate') { '{"status":"duplicate","message":"already there"}' } else { '{"status":"ok"}' }
              $b = [Text.Encoding]::UTF8.GetBytes($json)
              $ctx.Response.ContentType = 'application/json'
              $ctx.Response.OutputStream.Write($b, 0, $b.Length); $ctx.Response.Close()
            }
          } -ArgumentList $work
          Start-Sleep -Seconds 3
          function Run($flash) {
            New-Item -ItemType Directory -Force $flash | Out-Null
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Inspect-PC.ps1 -FlashRoot $flash -WebhookUrl 'http://127.0.0.1:18099/' -Inspector CI-Upload -SkipNetwork | Out-Null
            (Import-Csv "$flash\inspection-log.csv" | Select-Object -Last 1).uploadStatus
          }
          function Requests { if (Test-Path "$work\requests.txt") { @(Get-Content "$work\requests.txt").Count } else { 0 } }

          $a = Run "$PWD\pc1"
          Write-Host "run 1: $a, requests so far: $(Requests)"
          if ($a -ne 'uploaded' -or (Requests) -ne 1) { throw "First run must upload exactly once" }

          Start-Sleep -Seconds 2
          $b = Run "$PWD\pc1"      # same PC inspected again (e.g. new Wi-Fi card): a new row
          Write-Host "run 2 (same PC again): $b, requests so far: $(Requests)"
          if ($b -ne 'uploaded' -or (Requests) -ne 2) { throw "A PC inspected again must upload its new result" }

          'duplicate' | Set-Content "$work\mode.txt"
          $c = Run "$PWD\pc2"      # fresh PC folder, Sheet already has the serial
          Write-Host "run 3 (same run already saved): $c"
          if ($c -ne 'already-in-sheet') { throw "A duplicate answer must be reported calmly, not as an error" }

          Stop-Job $server; Remove-Job $server -Force; Start-Sleep -Seconds 1
          $d = Run "$PWD\pc3"      # Sheet unreachable
          Write-Host "run 4 (no internet): $d"
          if ($d -ne 'failed') { throw "An unreachable Sheet must be recorded as failed" }
          if ((Get-ChildItem "$PWD\pc3" -Filter 'pending*' -ErrorAction SilentlyContinue)) { throw "Nothing may be queued for later" }
          if (-not (Get-ChildItem "$PWD\pc3\logs" -Filter 'run-*.txt')) { throw "Run log was not written" }
          Write-Host "Upload logic OK"
          exit 0
      - name: Early failures are logged too
        shell: powershell
        run: |
          $d = "$PWD\crash"; New-Item -ItemType Directory -Force $d | Out-Null
          '{ this is not json' | Set-Content "$d\config.json"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Inspect-PC.ps1 -FlashRoot $d -SkipNetwork -NoUpload -Inspector X | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "Expected exit code 1, got $LASTEXITCODE" }
          $u = Import-Csv "$d\logs\usage-log.csv" | Select-Object -Last 1
          Write-Host "usage-log: $($u.overallResult) exit=$($u.exitCode)"
          if ($u.overallResult -ne 'config-error') { throw "Invalid config was not logged" }
          if (-not (Get-ChildItem "$d\logs" -Filter 'detail-*.txt')) { throw "No detail log" }
          exit 0
      - name: Finishes when the flash disk was removed
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Inspect-PC.ps1 -FlashRoot "$env:ProgramData\PC-Inspection" -UsbRoot 'Z:\gone\PC-Inspection' -Inspector CI-Removed -SkipNetwork -NoUpload 6>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Flash disk removed') { throw "Did not handle a removed flash disk" }
          exit 0
      - name: Run the .bat end-to-end (no upload)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force batusb | Out-Null
          Copy-Item dist\PC-Inspection.bat batusb\
          Copy-Item flashdisk\config.json batusb\
          cmd /c "echo.| batusb\PC-Inspection.bat -Inspector CI-Bat -NoUpload"
          $row = Import-Csv batusb\inspection-log.csv | Select-Object -Last 1
          Write-Host "Inspector recorded: $($row.inspector), result: $($row.overallResult)"
          if ($row.inspector -ne 'CI-Bat') { throw ".bat run did not record a result" }
          exit 0
      - name: Inspector menu picks a name by number
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force menu | Out-Null
          Copy-Item dist\PC-Inspection.exe menu\
          '{ "Inspectors": ["Alice Test", "Bob Test"], "RequireWifi": false }' | Set-Content menu\config.json
          cmd /c "echo 2| menu\PC-Inspection.exe --no-pause --wait -NoUpload -SkipNetwork"
          $row = Import-Csv menu\inspection-log.csv | Select-Object -Last 1
          Write-Host "Inspector recorded: $($row.inspector)"
          if ($row.inspector -ne 'Bob Test') { throw "Menu did not record 'Bob Test'" }
          exit 0   # the exe exits 2 because the CI VM fails the spec - that's expected

  release:
    needs: [build, windows-smoke-test]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PC-Inspection
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: PC Inspection ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            PC-Inspection-*.zip
            dist/PC-Inspection.exe
            dist/PC-Inspection.bat
          body: |
            **Download `PC-Inspection-${{ needs.build.outputs.version }}.zip`**, unzip it to the root of the flash disk, fill in `config.json`, then double-click `PC-Inspection.exe` on each PC.
            See RUNME.txt in the zip for details.
